name: TonTonP2PGuardStore
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.7.0'
    CURRENT_PROJECT_VERSION: 28
    PG_APP_ID: org.thunderguard.firewall.store
    PG_FILTER_ID: org.thunderguard.firewall.store.filter
    PG_GROUP: $(DEVELOPMENT_TEAM).org.thunderguard.firewall.store
    # macOS can retain the prior extension's launchd job until reboot.
    PG_FEED_SERVICE: $(PG_GROUP).feed.$(MARKETING_VERSION).$(CURRENT_PROJECT_VERSION)
targets:
  TonTonP2PGuard:
    type: application
    platform: macOS
    sources:
      - path: ../App
      - path: StoreFeed.swift
      - path: StoreFeedClient.m
      - path: StoreFeedClient.h
      - path: StoreFeedProtocol.h
      - path: Generated/Assets.xcassets
      - path: PrivacyInfo.xcprivacy
      - path: ../../LICENSE.md
        buildPhase: resources
      - path: ../../Build/Geography/Resources/ip4ranges.bin
        optional: true
        buildPhase: resources
      - path: ../../Build/Geography/Resources/ip6ranges.bin
        optional: true
        buildPhase: resources
      - path: ../../Build/Geography/Resources/map-centers.json
        optional: true
        buildPhase: resources
      - path: ../Resources/Geography-NOTICE.txt
        buildPhase: resources
    dependencies:
      - target: NetworkFilter
        embed: true
        link: false
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PG_APP_ID)
        PRODUCT_NAME: TonTon P2PGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) PG_STORE'
        SWIFT_OBJC_BRIDGING_HEADER: StoreFeedClient.h
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        INFOPLIST_FILE: App-Info.plist
        ENABLE_APP_SANDBOX: YES
  NetworkFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: ../Filter
      - path: ../../Integration/ThunderPeerWire.c
      - path: StoreFeed.m
      - path: StoreFeed.h
      - path: StoreFeedProtocol.h
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - sdk: Foundation.framework
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libbsm.tbd
    settings:
      base:
        PRODUCT_NAME: $(PG_FILTER_ID)
        PRODUCT_BUNDLE_IDENTIFIER: $(PG_FILTER_ID)
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) PG_STORE=1'
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
        CODE_SIGN_ENTITLEMENTS: Filter.entitlements
        INFOPLIST_FILE: Filter-Info.plist
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
schemes:
  TonTonP2PGuardStore:
    build:
      targets:
        TonTonP2PGuard: all
    archive:
      config: Release
